[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ottoneu-db"
version = "0.1.0"
description = "Database and analytics platform for Ottoneu Fantasy Football League 309"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.57.0",
    "supabase==2.27.2",
    "python-dotenv==1.2.1",
    # nfl_data_py 0.3.3 hard-pins pandas==1.5.3 (no Python 3.12 wheels); 0.3.2 has
    # the same import_* API and allows modern pandas. See #627 spike.
    "nfl_data_py==0.3.2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "scikit-learn==1.6.1",
    "requests==2.32.5",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "uv==0.11.21",
]

# Expose ``scripts`` (and its subpackages) as an importable package so modules
# resolve via the canonical ``scripts.<module>`` path. Combined with an editable
# install (``pip install -e .``), the repo root lands on ``sys.path`` from any
# working directory — including direct execution like ``python scripts/foo.py``
# — which removes the need for per-file ``sys.path`` manipulation.
[tool.setuptools]
packages = [
    "scripts",
    "scripts.tasks",
    "scripts.feature_projections",
    "scripts.feature_projections.features",
    "scripts.feature_projections.external_sources",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = ["test_*.py"]
# Put the repo root on sys.path so ``import scripts.*`` resolves during test
# collection without any per-file or conftest path manipulation.
pythonpath = ["."]
addopts = "--cov=scripts --cov-report=term-missing"
