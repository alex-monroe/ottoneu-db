<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SOFA DB mark: an S cut from a football standing on end, its points
       carrying the dollar bars (salaries and markets drive Ottoneu).
       The ball is drawn wide so the mark fills its square like the
       favicons it sits next to. Colors are design tokens: ink #0f172a,
       dark-theme accent #60a5fa (7:1 on ink), dark-theme line-strong
       #334155 for the edge. -->
  <style>
    .bg { fill: #0f172a; }
    /* On a dark tab strip the navy square would melt into the chrome. */
    @media (prefers-color-scheme: dark) { .bg { stroke: #334155; stroke-width: 1; } }
  </style>
  <rect class="bg" x=".5" y=".5" width="31" height="31" rx="7" />
  <path d="M16 2.5C27.5 8.5 27.5 23.5 16 29.5C4.5 23.5 4.5 8.5 16 2.5Z" fill="#60a5fa" />
  <path d="M 20.68 10.67 C 19.90 9.11 18.34 8.33 16.00 8.33 C 13.14 8.33 11.32 9.76 11.32 11.97 C 11.32 16.91 20.68 14.57 20.68 19.77 C 20.68 22.11 18.73 23.67 16.00 23.67 C 13.66 23.67 11.97 22.76 11.06 21.20" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
  <path d="M16 4.5V8.2M16 23.2V27.5" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" />
</svg>
