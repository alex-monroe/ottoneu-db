<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SOFA DB mark: an S cut from a football standing on end, its points
       carrying the dollar bars (salaries and markets drive Ottoneu).
       Colors are design tokens: ink #0f172a, dark-theme accent #60a5fa
       (7:1 on ink), dark-theme line-strong #334155 for the edge. -->
  <style>
    .bg { fill: #0f172a; }
    /* On a dark tab strip the navy square would melt into the chrome. */
    @media (prefers-color-scheme: dark) { .bg { stroke: #334155; stroke-width: 1; } }
  </style>
  <rect class="bg" x=".5" y=".5" width="31" height="31" rx="7" />
  <path d="M16 2.5C24 8 24 24 16 29.5C8 24 8 8 16 2.5Z" fill="#60a5fa" />
  <path d="M19.6 11.6C19 10.4 17.8 9.8 16 9.8C13.8 9.8 12.4 10.9 12.4 12.6C12.4 16.4 19.6 14.6 19.6 18.6C19.6 20.4 18.1 21.6 16 21.6C14.2 21.6 12.9 20.9 12.2 19.7" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" />
  <path d="M16 5.5V9M16 22.6V26.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
</svg>
