name: Scrape Arbitration Progress

on:
  # Manual trigger
  workflow_dispatch:

  # Every 6 hours; the gate job limits real runs to the arbitration window
  # (league_calendar arb_start..arb_end, plus one catch-up day).
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  # Lightweight check against the date-driven league_calendar resolver. Out of
  # the window the scrape job is skipped, so the run stays green and the
  # scheduled-failure alert only fires for real failures (#765).
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.arb_window.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install supabase python-dotenv
          pip install -e . --no-deps

      - name: Check arbitration window
        id: arb_window
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m scripts.arb_scrape_gate ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

  scrape:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --only-binary pandas,numpy playwright supabase python-dotenv pandas numpy
          # Install this repo as a package so `import scripts.*` resolves
          pip install -e . --no-deps

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FANGRAPHS_USERNAME: ${{ secrets.FANGRAPHS_USERNAME }}
          FANGRAPHS_PASSWORD: ${{ secrets.FANGRAPHS_PASSWORD }}
        run: |
          python -c "
          import os
          keys = ['SUPABASE_URL', 'SUPABASE_KEY', 'FANGRAPHS_USERNAME', 'FANGRAPHS_PASSWORD']
          with open('.env', 'w') as f:
              for k in keys:
                  f.write(f'{k}={os.environ[k]}\n')
          "

      - name: Scrape arbitration progress
        run: python scripts/scrape_arbitration_progress.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      # Push the fresh rows to the site now rather than on each page's
      # revalidate timer. Skips quietly until REVALIDATE_SECRET is set.
      - name: Revalidate site
        uses: ./.github/actions/revalidate-site
        with:
          secret: ${{ secrets.REVALIDATE_SECRET }}
