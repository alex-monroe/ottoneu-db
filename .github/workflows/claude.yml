name: Claude

# Mention @claude in a PR comment, a PR review or an inline review comment to have
# Claude answer, or make the change and push it to the PR branch. Commits come from
# the Claude GitHub App, so CI runs on them. See docs/references/claude-github.md.
#
# Only people with write access can trigger it (the repo is public), and the action
# itself ignores bot authors, so the automatic review's comments cannot start it —
# that loop belongs to Auto-fix, which is bounded by the one-review-per-PR rule.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The same dependencies CI uses, so Claude can run `just preflight` before it
      # pushes. venv/ is where the Justfile looks; `rust-just` is `just` from PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"
      - name: Install Python dependencies and just
        run: |
          uv venv --python 3.12 venv
          uv pip install --python venv/bin/python -r requirements.txt rust-just
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The repo's .claude/settings.json (allowlist, guard hooks) applies here too.
          # Its macOS sandbox does not: the runner is already a throwaway VM.
          settings: '{"sandbox": {"enabled": false}}'
          claude_args: |
            --max-turns 60
            --append-system-prompt "You are running in GitHub Actions for alex-monroe/ottoneu-db. Read AGENTS.md first. Run just preflight before you push and say in your reply whether it passed. Never run recipes that write production data (just analyze, just project, just promote, any --apply)."
