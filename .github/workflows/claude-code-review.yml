name: Claude Code Review

# On-demand review: comment `/claude-review` on a PR, or run it from the Actions
# tab. Not automatic on every PR — the local `/code-review` before `gh pr create`
# is the faster loop, and an always-on reviewer mostly re-reads diffs the
# authoring session already checked. (This used to auto-review PRs opened by
# Jules; no PR has come from Jules in months.)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: number

jobs:
  claude-review:
    # Comment trigger: PR comments only, from someone with write access to the repo
    # (the repo is public — without the author check anyone could spend the token).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.inputs.pr_number || github.event.issue.number }}

            Review this pull request. Read AGENTS.md first — it lists the
            repo's architectural rules (enforced by tests), the fp_* table
            rule, and the projection-model validation protocol.

            Report only issues that would matter if merged: correctness bugs,
            security problems, violations of AGENTS.md rules, and projection
            changes that lack a held-out significance verdict. Skip style nits
            that lint/typecheck already cover. Put each specific issue in an
            inline comment; post one short top-level summary comment. If you
            find nothing worth fixing, say so in one line.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
