name: Claude Code Review

# Two ways in (docs/references/claude-github.md):
#
# - auto-review: once per PR, when it opens or leaves draft, with Anthropic's
#   `code-review` plugin. The plugin skips PRs that already carry a Claude comment,
#   so pushes (including Auto-fix's own fix commits) never set off a second review,
#   and the review/fix loop is bounded. Findings land as inline comments, which
#   Auto-fix (desktop or `/autofix-pr` in the cloud) then picks up.
# - claude-review: on demand — comment `/claude-review` on a PR, or run it from the
#   Actions tab. Use it to ask again after the automatic review, with the repo's own
#   review brief.
#
# Both run on the CLAUDE_CODE_OAUTH_TOKEN subscription token. The repo is public, so
# fork PRs (which get no secrets) and comments from people without write access are
# skipped rather than spending the token.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: number

jobs:
  auto-review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the inline-comment MCP server only when --allowedTools names it.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

  claude-review:
    # Comment trigger: PR comments only, from someone with write access to the repo
    # (the repo is public — without the author check anyone could spend the token).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.inputs.pr_number || github.event.issue.number }}

            Review this pull request. Read AGENTS.md first — it lists the
            repo's architectural rules (enforced by tests), the fp_* table
            rule, and the projection-model validation protocol.

            Report only issues that would matter if merged: correctness bugs,
            security problems, violations of AGENTS.md rules, and projection
            changes that lack a held-out significance verdict. Skip style nits
            that lint/typecheck already cover. Put each specific issue in an
            inline comment; post one short top-level summary comment. If you
            find nothing worth fixing, say so in one line.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
