name: Scrape Trade History

# Keeps `trades` + `trade_assets` — every accepted trade, its cap loans, and the
# ones still inside the 48-hour approval window — in step with Ottoneu's public
# /trade_history page. One list request, plus one /view_trade page for each trade
# that is new or still pending, a second apart. Plain HTTP: no browser, no login.
#
# Every four hours rather than daily because a pending trade only exists for 48
# hours, and the /trades page is how the league sizes one up before it processes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and print without writing"
        type: boolean
        default: false

  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: scrape-trade-history
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 supabase python-dotenv
          # Install this repo as a package so `import scripts.*` resolves
          pip install -e . --no-deps

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_SECRET_KEY }}" >> .env

      - name: Scrape trade history
        env:
          # Optional: only needed if Ottoneu ever puts the page behind login.
          OTTONEU_COOKIE: ${{ secrets.OTTONEU_COOKIE }}
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python scripts/scrape_trade_history.py $ARGS

      # Push the fresh rows to the site now rather than on each page's
      # revalidate timer. Skips quietly until REVALIDATE_SECRET is set.
      - name: Revalidate site
        if: inputs.dry_run != true
        uses: ./.github/actions/revalidate-site
        with:
          secret: ${{ secrets.REVALIDATE_SECRET }}

  # Post what the scrape just stored to the league Discord: a heads-up for each
  # new pending trade (the 48-hour veto window), then each newly processed one.
  # The discord_posts log keeps every trade to one post per state, so a re-run
  # posts nothing new. A dry-run dispatch prints the posts instead.
  #
  # Trades go to the league's trade channel, not the general one. Its id is the
  # DISCORD_TRADES_CHANNEL_ID repository variable (Settings → Secrets and
  # variables → Actions → Variables); until it is set the job runs only for a dry run, and
  # the --max-age-days window posts the last three days' trades once it is.
  post-discord:
    needs: scrape
    if: vars.DISCORD_TRADES_CHANNEL_ID != '' || inputs.dry_run == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Post new trades to Discord
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_TRADES_CHANNEL_ID }}
          SITE_URL: https://sofa-db.vercel.app
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          npm run post-trades -- "${ARGS[@]}"
