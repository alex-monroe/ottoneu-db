name: Update Projections

# Projection promotion is a deliberate local action (`just promote`), so this
# workflow is manual-only. The previous push trigger only watched legacy paths
# (projection_methods.py / update_projections.py / config.py) and never fired
# for the active feature-model code under scripts/feature_projections/ or
# model_config.py — so it was removed rather than extended (#622).
on:
  workflow_dispatch:

jobs:
  update-projections:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run projections update script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      run: python scripts/update_projections.py
