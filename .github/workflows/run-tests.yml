name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Cancel superseded runs on the same ref so stacked pushes don't burn duplicate
# runners (only the latest commit's run matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Set up uv (with cache)
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt"

    - name: Install dependencies (from pinned lock)
      run: time uv pip install --system -r requirements.txt

    - name: Run pytest with coverage
      run: |
        python -m pytest --cov=. --cov-report=term-missing --cov-report=html:coverage-html

    - name: Check documentation freshness
      run: python scripts/check_docs_freshness.py

    - name: Upload Python coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: python-coverage
        path: coverage-html/

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      run: npm ci

    - name: TypeScript type check
      run: npx tsc --noEmit

    - name: ESLint
      run: npm run lint
      
    - name: Run Jest tests with coverage
      run: npx jest --coverage --ci

    - name: Upload web coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-coverage
        path: web/coverage/
