name: Scrape Player Cards

# Fetches Ottoneu player cards over plain HTTP (no browser) and upserts their
# transaction history. Replaces the Playwright search-page crawl:
# instead of clicking around to discover players, we already know every Ottoneu
# player id from the database, so we hit each player_card URL directly.
#
# Sends an honest User-Agent (impersonating a browser is what trips Cloudflare —
# not the datacenter IP), so this runs fine on stock GitHub-hosted runners.

# ORDERING: this job is scheduled AFTER pull-roster-csv (06:17) on purpose.
# reconcile_roster runs first because it discovers/creates new player rows that this
# scrape then needs; the cost is that its inferred transactions are filed before the
# real card rows exist, so the same move lands twice. This scrape ends by deleting the
# inferences its real rows supersede (scripts/transaction_dedupe.py), which is what
# makes the pair converge. Don't drop that purge or reorder these two without reading
# docs/references/roster-csv-reconciliation.md.

# RATE LIMIT: since 2026-10-02 Ottoneu's Cloudflare answers a burst of card requests
# with HTTP 429. So the daily run only fetches the cards that can have changed
# (--recent-days: players with a recent inferred transaction or a new league_prices
# row), and a weekly full sweep catches what that signal cannot see (arbitration
# `increase` rows). The script paces itself and backs off on a 429; see "Rate
# limiting" in docs/references/roster-csv-reconciliation.md before changing either.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Scrape every player (slow) instead of only recent movers"
        type: boolean
        default: false
  schedule:
    # Daily at 06:40 UTC — recent movers only.
    - cron: "40 6 * * *"
    # Weekly full sweep, Mondays 09:10 UTC. Keep in sync with FULL_SWEEP_CRON below.
    - cron: "10 9 * * 1"

# One scrape at a time: two would write the same rows and split nothing useful.
concurrency:
  group: scrape-player-cards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-player-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FULL_SWEEP_CRON: "10 9 * * 1"
      PYTHONUNBUFFERED: "1"  # progress and backoff lines in order, as they happen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml supabase python-dotenv
          pip install -e . --no-deps

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_SECRET_KEY }}" >> .env

      - name: Scrape player-card transactions
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$SCHEDULE" = "$FULL_SWEEP_CRON" ] || [ "$FULL" = "true" ]; then
            python scripts/scrape_player_cards.py --apply
          else
            python scripts/scrape_player_cards.py --apply --recent-days 14
          fi
