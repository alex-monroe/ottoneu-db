name: Backfill Player Stats

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season year(s) to backfill — space-separated (e.g. '2022 2023 2024')"
        required: true
        default: "2024"
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        # Pinned to 3.9 to match the project's dependency stack (pandas==1.5.3 /
        # numpy==1.26.4 ship no wheels for 3.12) and the local venv + run-tests.yml.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # The backfill runs scripts/worker.py, which imports the full app stack
          # (playwright, nfl_data_py, pandas, ...). Install the package WITH its
          # pyproject-pinned dependencies so the versions stay a single source of
          # truth rather than a hand-maintained list that drifts.
          pip install -e .

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_SECRET_KEY }}" >> .env

      - name: Enqueue and run player stats backfill
        run: |
          python scripts/enqueue.py player-stats --seasons ${{ inputs.seasons }}
          python scripts/worker.py
