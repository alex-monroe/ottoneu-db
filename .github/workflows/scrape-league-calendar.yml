name: Scrape League Calendar

# Scrapes the Ottoneu finances page Calendar section into `league_calendar`, the
# source of truth for the season-cycle resolver (scripts/season.py, web/lib/season.ts).
#
# Plain HTTP, no browser and no login: the finances page is public, and it is
# reachable from GitHub-hosted runners as long as we send an HONEST User-Agent —
# impersonating a browser is what trips Cloudflare's challenge, not the datacenter
# IP. Same lesson as pull-roster-csv.yml. OTTONEU_COOKIE is an optional escape
# hatch only needed if the page is ever gated behind a session.

on:
  # Manual trigger
  workflow_dispatch:

  # Weekly — boundary dates change rarely, but the auction date gets set
  # mid-cycle and the season label rolls over each January.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 supabase python-dotenv
          # Install this repo as a package so `import scripts.*` resolves
          pip install -e . --no-deps

      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -c "
          import os
          keys = ['SUPABASE_URL', 'SUPABASE_KEY']
          with open('.env', 'w') as f:
              for k in keys:
                  f.write(f'{k}={os.environ[k]}\n')
          "

      - name: Scrape league calendar
        env:
          OTTONEU_COOKIE: ${{ secrets.OTTONEU_COOKIE }}
        run: python scripts/scrape_league_calendar.py
